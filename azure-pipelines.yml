# Node.js with React
# Build a Node.js project that uses React.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
    - master

    # main group for variables
variables:
    -group: mainGroup

pool:
    vmImage: 'ubuntu-latest'

stages:
    # - stage: NpmRunTests
    #   jobs:
    #       - job:
    #         steps:
    #             - task: NodeTool@0
    #               inputs:
    #                   versionSpec: '10.x'
    #               displayName: 'Install Node.js'

    #             - script: npm install
    #               workingDirectory: client
    #               displayName: 'npm install'

    - stage: DeployPackages
      # dependsOn: NpmRunTests
      condition: and(succeeded(), eq(variables['build.sourceBranch'], 'refs/heads/master'))
      jobs:
          - job:
            steps:
                # Check out the code and keep the token so we can tag the repository
                # - checkout: self
                #   persistCredentials: true
                - task: NodeTool@0
                  inputs:
                    versionSource: 'spec'
                    versionSpec: '22.x'
                  displayName: 'Install Node.js 22'

                - script: npm install -f
                  workingDirectory: client
                  displayName: 'npm install'

                - script: npm test -- --run
                  workingDirectory: client
                  displayName: 'npm test'

                - script: |
                      git clone --branch 3.47.0 --depth 1 https://github.com/flutter/flutter.git "$(Agent.ToolsDirectory)/flutter"
                      echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/flutter/bin"
                      "$(Agent.ToolsDirectory)/flutter/bin/flutter" config --no-analytics
                      "$(Agent.ToolsDirectory)/flutter/bin/flutter" precache --web
                  displayName: 'Install Flutter 3.47.0'

                - script: |
                      set -euo pipefail
                      quiz_dir="$(Agent.TempDirectory)/quiz-app-live"
                      output_dir="$(Build.SourcesDirectory)/client/public/skarp-live"
                      if [[ -z "${GITHUB_READ_TOKEN:-}" || "$GITHUB_READ_TOKEN" == '$('* ]]; then
                          echo "GITHUB_READ_TOKEN is missing from the pipeline secret variables." >&2
                          exit 1
                      fi
                      git -c "http.extraHeader=Authorization: Bearer $GITHUB_READ_TOKEN" \
                          clone --branch main --depth 1 \
                          https://github.com/jacobhal/quiz-app.git "$quiz_dir"
                      cd "$quiz_dir"
                      flutter pub get
                      sentry_args=()
                      case "${SKARP_SENTRY_DSN:-}" in
                          ''|'$('*) ;;
                          *) sentry_args+=(--dart-define="SENTRY_DSN=$SKARP_SENTRY_DSN") ;;
                      esac
                      flutter build web \
                          --release \
                          --target lib/live_room_web_main.dart \
                          --base-href /skarp-live/ \
                          --dart-define="SUPABASE_URL=$WEB_SUPABASE_SKARP_URL" \
                          --dart-define="SUPABASE_ANON_KEY=$WEB_SUPABASE_SKARP_ANON_KEY" \
                          --dart-define=SUPABASE_TARGET=prod \
                          --dart-define=APP_ENV=prod \
                          "${sentry_args[@]}"
                      rm -rf "$output_dir"
                      mkdir -p "$output_dir"
                      cp -R build/web/. "$output_dir/"
                  displayName: 'Build shared Skarp Live Quiz client'
                  env:
                    WEB_SUPABASE_SKARP_URL: $(WEB_SUPABASE_SKARP_URL)
                    WEB_SUPABASE_SKARP_ANON_KEY: $(WEB_SUPABASE_SKARP_ANON_KEY)
                    SKARP_SENTRY_DSN: $(SKARP_SENTRY_DSN)
                    GITHUB_READ_TOKEN: $(GITHUB_READ_TOKEN)
                
                - script: npm run build
                  workingDirectory: client
                  displayName: 'npm run build'
                  env:
                    VITE_SENTRY_RELEASE: jacobhal-se@$(Build.SourceVersion)
                    SENTRY_AUTH_TOKEN: $(SENTRY_AUTH_TOKEN)
                    # Acquisition tracking for /skarp and /krydda, read back
                    # on /stats. One Supabase project per app, so each app's
                    # marketing data sits beside its own auth.users and /stats
                    # can show real user counts. The anon keys are public by
                    # design: the events table is insert-only for them and the
                    # dashboard is passphrase gated server-side. From the
                    # mainGroup variable group; if unset the pages record
                    # nothing and the download buttons still work.
                    VITE_SUPABASE_SKARP_URL: $(WEB_SUPABASE_SKARP_URL)
                    VITE_SUPABASE_SKARP_ANON_KEY: $(WEB_SUPABASE_SKARP_ANON_KEY)
                    VITE_SUPABASE_KRYDDA_URL: $(WEB_SUPABASE_KRYDDA_URL)
                    VITE_SUPABASE_KRYDDA_ANON_KEY: $(WEB_SUPABASE_KRYDDA_ANON_KEY)

                - script: |
                      sudo apt-get update
                      sudo apt-get -qq install git-ftp
                  displayName: 'Running apt-get to install packages...'
                # $(Build.ArtifactStagingDirectory) instead of syncroot not working

                - script: git status
                  displayName: 'git status'
                  
                - script: git reset --hard HEAD 
                  displayName: 'git reset --hard HEAD'

                - script: |
                      git config git-ftp.production.user $FTP_USERNAME
                      git config git-ftp.production.url $FTP_HOST_NEW
                      git config git-ftp.production.password $FTP_PASSWORD
                      git config git-ftp.production.syncroot $FTP_SYNC_ROOT
                      git config git-ftp.production.remote-root $FTP_REMOTE_ROOT
                  displayName: 'Setting git config values...'

                - script: |
                      git ftp push -s production --all
                  displayName: 'Pushing FTP packages...'
